[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trellismx-sub3bit-engram-kit"
version = "0.1.0"
description = "Model-neutral per-expert sub-3-bit TrellisMX quantization and Host-RAM Engram QEC toolkit for MoE language models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4",
    "torch>=2.4",
    "transformers>=4.46",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["trellismx_kit*"]
